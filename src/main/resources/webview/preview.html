<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>zplflow Live Preview</title>
  <style>
    body {
      margin: 0;
      background: #1e1f22;
      color: #dfe1e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #2b2d30;
      border-bottom: 1px solid #393b40;
    }
    .viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #label-img {
      max-width: 100%;
      height: auto;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: none;
    }
    #error-banner {
      display: none;
      background: #5a1d1d;
      color: #f48771;
      padding: 8px 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span>zplflow Live Preview</span>
    <span id="meta-badge" style="margin-left:auto;font-size:11px;color:#8c929d;">Ready</span>
  </div>
  <div id="error-banner"></div>
  <div class="viewport">
    <div id="placeholder">Open a .zpl file and save to preview.</div>
    <img id="label-img" alt="ZPL Label Preview" />
  </div>
  <script>
    window.updateZplPreview = function(payload) {
      const img = document.getElementById('label-img');
      const placeholder = document.getElementById('placeholder');
      const errBanner = document.getElementById('error-banner');
      const badge = document.getElementById('meta-badge');

      if (payload.error) {
        errBanner.style.display = 'block';
        errBanner.textContent = payload.error;
        return;
      }
      errBanner.style.display = 'none';
      if (payload.pngBase64) {
        placeholder.style.display = 'none';
        img.style.display = 'block';
        img.src = 'data:image/png;base64,' + payload.pngBase64;
        badge.textContent = payload.fromCache
          ? 'Cached (0ms) • ' + payload.dpi + ' DPI'
          : 'Page ' + (payload.currentPage + 1) + '/' + payload.pageCount + ' • ' + payload.dpi + ' DPI';
      }
    };
  </script>
</body>
</html>
