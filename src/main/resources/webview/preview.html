<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ZplFlow Live Preview</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1e1f22;
      color: #dfe1e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #2b2d30;
      border-bottom: 1px solid #393b40;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .toolbar select, .toolbar button {
      background: #393b40;
      color: #dfe1e5;
      border: 1px solid #4e5157;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
    }
    .toolbar button:hover {
      background: #3574f0;
      color: #ffffff;
      cursor: pointer;
    }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 500;
    }
    .badge.cached {
      background: #1e3a24;
      color: #7ee787;
    }
    .badge.quota {
      background: #263342;
      color: #6cb6ff;
    }
    .badge.dpi {
      background: #393b40;
      color: #dfe1e5;
    }
    .spacer {
      margin-left: auto;
    }
    #error-banner {
      display: none;
      background: #471717;
      color: #ff8585;
      padding: 8px 12px;
      font-size: 12px;
      border-bottom: 1px solid #802424;
      word-break: break-word;
    }
    .viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(#2d3034 1px, transparent 1px);
      background-size: 16px 16px;
    }
    #label-img {
      max-width: 95%;
      height: auto;
      background: #ffffff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
      border-radius: 2px;
      display: none;
    }
    #placeholder {
      color: #8c929d;
      font-size: 13px;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span style="font-weight: 600; color: #ffffff;">ZplFlow</span>
    <span id="page-indicator" style="color: #8c929d;">Page 1/1</span>
    <span class="spacer"></span>
    <span id="badge-cached" class="badge cached" style="display:none;">Cached (0ms)</span>
    <span id="badge-quota" class="badge quota" style="display:none;">Quota</span>
    <span id="badge-dpi" class="badge dpi">203 DPI</span>
  </div>
  <div id="error-banner"></div>
  <div class="viewport">
    <div id="placeholder">Open a ZPL file (.zpl, .prn, .label) to preview in real-time.</div>
    <img id="label-img" alt="ZPL Label Preview" />
  </div>

  <script>
    window.updateZplPreview = function(payload) {
      const img = document.getElementById('label-img');
      const placeholder = document.getElementById('placeholder');
      const errBanner = document.getElementById('error-banner');
      const cachedBadge = document.getElementById('badge-cached');
      const quotaBadge = document.getElementById('badge-quota');
      const dpiBadge = document.getElementById('badge-dpi');
      const pageIndicator = document.getElementById('page-indicator');

      if (payload.error) {
        errBanner.style.display = 'block';
        errBanner.textContent = payload.error;
        cachedBadge.style.display = 'none';
        quotaBadge.style.display = 'none';
        return;
      }

      errBanner.style.display = 'none';

      if (payload.pngBase64) {
        placeholder.style.display = 'none';
        img.style.display = 'block';
        img.src = 'data:image/png;base64,' + payload.pngBase64;

        if (payload.pageCount) {
          pageIndicator.textContent = 'Page ' + ((payload.currentPage || 0) + 1) + '/' + payload.pageCount;
        }

        if (payload.dpi) {
          dpiBadge.textContent = payload.dpi + ' DPI';
        }

        if (payload.fromCache) {
          cachedBadge.style.display = 'inline-block';
          quotaBadge.style.display = 'none';
        } else {
          cachedBadge.style.display = 'none';
          if (payload.rateLimitRemaining !== undefined && payload.rateLimitRemaining !== null) {
            quotaBadge.style.display = 'inline-block';
            quotaBadge.textContent = 'Quota: ' + payload.rateLimitRemaining + '/min';
          } else {
            quotaBadge.style.display = 'none';
          }
        }
      }
    };

    if (window.__pendingPayload) {
      window.updateZplPreview(window.__pendingPayload);
      delete window.__pendingPayload;
    }
  </script>
</body>
</html>
